services:
  api:
    build: ./backend
    container_name: url-shortener-api
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped
    volumes:                       # ← NEW, added by dev file
      - ./backend:/app
      - /app/node_modules 
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: url-shortener-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: url-shortener-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    restart: unless-stopped

volumes:
  mongo_data: